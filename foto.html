<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fotomu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9e6e3; --card: #faf8f6; --ink: #161616; --mute: #66625e; --line: #dedad5; --accent: #d63c22; --on-accent: #faf8f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --card: #1f1d1c; --ink: #f3f0ed; --mute: #a9a39d; --line: #33302d; --accent: #e8573e; --on-accent: #161616; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; min-height: 100dvh; display: flex; flex-direction: column; gap: 20px; }
  header p { margin: 0 0 4px; color: var(--mute); font-size: 14px; }
  h1 { margin: 0; font-size: clamp(28px, 8vw, 40px); line-height: 1.1; letter-spacing: -0.03em; font-weight: 700; text-wrap: balance; }
  .frame { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .photo { display: block; width: 100%; height: auto; border-radius: 6px; opacity: 0; transition: opacity 220ms cubic-bezier(0.23, 1, 0.32, 1); }
  .photo.ready { opacity: 1; }
  .wait { aspect-ratio: 2 / 3; display: grid; place-items: center; color: var(--mute); font-size: 14px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  a.button { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 20px; border-radius: 999px; font-weight: 600; font-size: 16px; text-decoration: none; transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1); }
  a.button:active { transform: scale(0.97); }
  a.button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  a.primary { background: var(--accent); color: var(--on-accent); }
  a.quiet { color: var(--ink); border: 1px solid var(--line); }
  .note { color: var(--mute); font-size: 14px; line-height: 1.5; margin: 0; }
  footer { margin-top: auto; padding-top: 12px; color: var(--mute); font-size: 13px; }
  footer a { color: inherit; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .photo, a.button { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <p id="lead">Fotomu dari</p>
    <h1 id="event">Photobooth</h1>
  </header>

  <div class="frame" id="frame">
    <div class="wait" id="wait">Memuat foto</div>
    <img class="photo" id="photo" alt="Foto dari photobooth" hidden>
  </div>

  <div class="actions" id="actions" hidden>
    <a class="button primary" id="download">Unduh foto</a>
    <a class="button quiet" id="drive" target="_blank" rel="noopener">Buka di Google Drive</a>
  </div>

  <p class="note" id="note" hidden></p>

  <footer>Dibuat dengan <a href="index.html">BoothCamp</a></footer>
</main>
<script>
  // Alamat halaman ini membawa dua hal: f = nomor berkas di Google Drive panitia, a = nama acara.
  // Fotonya sendiri tetap di Drive panitia; halaman ini hanya menampilkannya.
  const query = new URLSearchParams(location.search);
  const id = query.get("f") || "";
  const name = (query.get("a") || "").trim().slice(0, 80);
  const el = (x) => document.getElementById(x);

  if (name) { el("event").textContent = name; document.title = "Fotomu dari " + name; }
  else el("lead").hidden = true;

  if (!/^[A-Za-z0-9_-]{10,}$/.test(id)) {
    el("frame").hidden = true;
    el("note").hidden = false;
    el("note").textContent = "Tautan foto ini tidak lengkap. Pindai lagi kode QR di booth, atau tanyakan ke panitia.";
  } else {
    const drive = "https://drive.google.com/file/d/" + id + "/view";
    el("drive").href = drive;
    el("download").href = "https://drive.google.com/uc?export=download&id=" + id;
    el("actions").hidden = false;

    const photo = el("photo");
    photo.onload = () => { el("wait").hidden = true; photo.hidden = false; requestAnimationFrame(() => photo.classList.add("ready")); };
    // Kalau Google tidak mau menampilkan gambarnya di sini (tautan ditutup panitia, atau jalurnya berubah),
    // tamu tetap punya jalan: tombol Google Drive di bawah.
    photo.onerror = () => {
      el("frame").hidden = true;
      el("download").hidden = true;
      el("note").hidden = false;
      el("note").textContent = "Fotonya tidak bisa ditampilkan di halaman ini. Coba buka lewat Google Drive. Kalau di sana juga tidak bisa, tautannya mungkin sudah ditutup panitia.";
    };
    photo.src = "https://drive.google.com/thumbnail?id=" + id + "&sz=w1600";
  }
</script>
</body>
</html>
